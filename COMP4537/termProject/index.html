<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMP4537 – Term Project</title>
    <link rel="stylesheet" href="/jcardas.com/COMP4537/termProject/termProject.css">
</head>
<body>

<a href="/jcardas.com/COMP4537/labs/" class="back-btn">← Back to Labs</a>

<div class="card">
    <h1>Send a Text</h1>
    <p>Enter a phone number and your message below.</p>

    <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1 (604) 000-0000">
    </div>

    <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Type your message here..."></textarea>
    </div>

    <button type="button">Send Message</button>
</div>

<script src="/jcardas.com/COMP4537/termProject/phoneService.js"></script>


</body>
</html>
